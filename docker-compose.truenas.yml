services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /mnt/tank/apps/travelexpensinator/uploads:/app/uploads
      - /mnt/tank/apps/travelexpensinator/data:/app/data
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - NODE_ENV=production
      - CORS_ORIGINS=*
    restart: unless-stopped
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    restart: unless-stopped

networks:
  default:
    name: travelexpensinator_network